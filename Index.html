<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JINIE | Auth Portal</title>
    <style>
        :root {
            --primary-bg: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #1a1a2e);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --accent-color: #4cc9f0;
            --text-light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--primary-bg);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 420px;
            min-height: 580px;
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header h1 {
            color: var(--text-light);
            font-size: 2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 800;
        }

        .brand-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        .toggle-box {
            width: 100%;
            display: flex;
            margin-bottom: 30px;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 5px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            background: transparent;
            border: 0;
            outline: none;
            position: relative;
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            z-index: 2;
            transition: 0.3s;
        }

        .active-bg {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 100%); /* Adjusted via JS */
            height: 40px; 
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        .form-container-outer {
            overflow: hidden;
            width: 100%;
        }

        .form-container {
            display: flex;
            width: 200%;
            transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        form {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 5px;
        }

        .input-group {
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent-color);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button.submit-btn {
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: var(--accent-color);
            color: #111;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        button.submit-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4);
        }

        .slide-left { transform: translateX(-50%); }
        .active-text { color: #fff !important; }

    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <h1>JINIE</h1>
            <p>Advanced Systems Access</p>
        </div>

        <div class="toggle-box">
            <div id="active-bg" class="active-bg"></div>
            <button class="toggle-btn active-text" id="t-log" onclick="showForm('login')">Login</button>
            <button class="toggle-btn" id="t-reg" onclick="showForm('register')">Register</button>
        </div>

        <div class="form-container-outer">
            <div class="form-container" id="form-wrapper">
                <form id="log">
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit" class="submit-btn">Initialize Session</button>
                </form>

                <form id="reg">
                    <input type="text" name="name" placeholder="Full Name" required>
                    <input type="text" name="student_id" placeholder="Student ID" required>
                    <input type="email" name="email" placeholder="Email Address" required>
                    <input type="text" name="department" placeholder="Department" required>
                    <input type="text" name="hall_name" placeholder="Hall Name" required>
                    <input type="password" name="password" placeholder="Set Password" required>
                    <button type="submit" class="submit-btn">Create Identity</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById("form-wrapper");
        const activeBg = document.getElementById("active-bg");
        const tLog = document.getElementById("t-log");
        const tReg = document.getElementById("t-reg");

        function showForm(type) {
            if (type === 'register') {
                wrapper.classList.add("slide-left");
                activeBg.style.left = "calc(50% - 0px)";
                tReg.classList.add("active-text");
                tLog.classList.remove("active-text");
            } else {
                wrapper.classList.remove("slide-left");
                activeBg.style.left = "5px";
                tLog.classList.add("active-text");
                tReg.classList.remove("active-text");
            }
        }

        async function send(form, url) {
            const btn = form.querySelector('.submit-btn');
            const originalText = btn.innerText;
            btn.innerText = "Processing...";
            btn.disabled = true;

            const data = new FormData(form);
            try {
                const res = await fetch(url, { 
                    method: "POST", 
                    body: data 
                });
                const result = await res.json();
                
                if (res.ok) {
                    alert("Success: " + (result.message || "Welcome to JINIE"));
                } else {
                    alert("System Error: " + (result.detail || "Authentication Failed"));
                }
            } catch (err) {
                alert("Core Connection Failure: Could not reach the server.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        document.getElementById("reg").onsubmit = e => {
            e.preventDefault();
            send(e.target, "/register");
        };

        document.getElementById("log").onsubmit = e => {
            e.preventDefault();
            send(e.target, "/login");
        };
    </script>
</body>
</html>
