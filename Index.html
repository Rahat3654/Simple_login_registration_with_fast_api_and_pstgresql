<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JINIE | Auth Portal</title>
    <style>
        /* CSS Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 350px;
            height: 450px;
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            overflow: hidden;
            padding: 30px;
        }

        .toggle-box {
            width: 100%;
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
            position: relative;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 30px;
        }

        .toggle-btn {
            padding: 10px 20px;
            cursor: pointer;
            background: transparent;
            border: 0;
            outline: none;
            position: relative;
            color: white;
            font-weight: 600;
            z-index: 2;
            transition: 0.3s;
        }

        .active-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: #fff;
            border-radius: 30px;
            transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 1;
        }

        .form-container {
            display: flex;
            width: 200%; /* Two forms side-by-side */
            transition: 0.5s ease-in-out;
            position: relative;
        }

        form {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            outline: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button.submit-btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button.submit-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        /* Class to slide the forms */
        .slide-left {
            transform: translateX(-50%);
        }

        .active-text {
            color: #333 !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="toggle-box">
            <div id="active-bg" class="active-bg"></div>
            <button class="toggle-btn active-text" id="t-log" onclick="showForm('login')">Login</button>
            <button class="toggle-btn" id="t-reg" onclick="showForm('register')">Register</button>
        </div>

        <div class="form-container" id="form-wrapper">
            <form id="log">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="submit-btn">Enter System</button>
            </form>

<form id="reg">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="text" name="student_id" placeholder="Student ID" required>
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="text" name="department" placeholder="Department" required>
    <input type="text" name="hall_name" placeholder="Hall Name" required>
    <input type="password" name="password" placeholder="Set Password" required>
    <button type="submit" class="submit-btn">Create Account</button>
</form>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById("form-wrapper");
        const activeBg = document.getElementById("active-bg");
        const tLog = document.getElementById("t-log");
        const tReg = document.getElementById("t-reg");

        // UI Toggle Function
        function showForm(type) {
            if (type === 'register') {
                wrapper.classList.add("slide-left");
                activeBg.style.left = "50%";
                tReg.classList.add("active-text");
                tLog.classList.remove("active-text");
            } else {
                wrapper.classList.remove("slide-left");
                activeBg.style.left = "0";
                tLog.classList.add("active-text");
                tReg.classList.remove("active-text");
            }
        }

        // Shared Send Logic
        async function send(form, url) {
            const data = new FormData(form);
            try {
                const res = await fetch(url, { method: "POST", body: data });
                const msg = await res.text();
                alert(msg);
            } catch (err) {
                alert("Error connecting to server.");
            }
        }

        // Form Listeners
        document.getElementById("reg").onsubmit = e => {
            e.preventDefault();
            send(e.target, "/register");
        };

        document.getElementById("log").onsubmit = e => {
            e.preventDefault();
            send(e.target, "/login");
        };
    </script>
</body>
</html>
